<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f172a">
<title>위치 공유 · 참가자</title>
<style>
:root{--bg:#0f172a;--panel:#16233f;--line:#273656;--tx:#eef3fb;--mut:#92a3c4;--pri:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}
body{font:16px/1.45 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
h1{font-size:17px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.lab{font-size:12px;color:var(--mut);margin-bottom:2px}
.dms{font:700 clamp(26px,8.2vw,34px)/1.15 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.5px}
.dec{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin-top:4px}
.sep{height:1px;background:var(--line);margin:14px 0}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px;color:#fff;background:#243453;width:100%}
button.pri{background:var(--pri)}button.bad{background:#b91c1c}button:active{opacity:.8}
input{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1426;color:var(--tx)}
.center{margin:auto 0;text-align:center}
.big{font-size:44px}
.mut{color:var(--mut);font-size:13px}
ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.show{display:flex}.ov .card{width:100%;max-width:400px}
.row2{display:flex;gap:10px;margin-top:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <section id="vMsg" class="center hide"><div class="big" id="msgIcon">⚠️</div><h2 id="msgT" style="margin:6px 0"></h2><p class="mut" id="msgD"></p><button id="msgBtn" class="pri hide" style="margin-top:14px"></button></section>

  <section id="vConsent" class="hide">
    <h1>📍 위치 공유 참여</h1>
    <div class="card" style="margin-top:12px">
      <h2 style="margin:0 0 8px;font-size:18px">위치정보 제공 동의</h2>
      <p style="margin:0 0 6px">운영자에게 내 <b>현재 위치(GPS)</b>를 <b>30초마다</b> 전송합니다.</p>
      <ul>
        <li>이 페이지를 연 동안에만 공유되며, 언제든 종료할 수 있습니다.</li>
        <li>위치는 암호화되어 운영자에게만 전달되고 서버에 저장되지 않습니다.</li>
        <li>화면을 켜 둔 상태에서 정확하게 전송됩니다.</li>
      </ul>
      <div class="sep"></div>
      <div class="lab">운영자에게 보일 이름 (선택)</div>
      <input id="name" maxlength="12" placeholder="예) 김민수" autocomplete="off">
    </div>
    <div class="row2" style="flex-direction:column;margin-top:14px">
      <button class="pri" id="bAgree">동의하고 위치 공유 시작</button>
      <button id="bDecline">동의하지 않음 (접속 종료)</button>
    </div>
  </section>

  <section id="vMain" class="hide" style="display:none;flex-direction:column;gap:12px">
    <h1>📍 현재 위치</h1>
    <div class="card">
      <div class="lab">위도 (Latitude)</div><div class="dms" id="lat">—</div>
      <div class="sep"></div>
      <div class="lab">경도 (Longitude)</div><div class="dms" id="lng">—</div>
      <div class="dec" id="dec"></div>
      <div class="sep"></div>
      <div class="meta"><span id="acc">위치를 찾는 중…</span><span id="sent"></span></div>
    </div>
    <button class="bad" id="bLeave" style="margin-top:auto">위치 공유 종료</button>
    <div class="mut" style="text-align:center">화면을 끄거나 다른 앱으로 이동하면 전송이 멈출 수 있습니다.</div>
  </section>
</div>

<div class="ov" id="ov"><div class="card">
  <h2 style="margin:0 0 8px;font-size:18px" id="ovT"></h2><p style="margin:0;color:var(--mut)" id="ovD"></p>
  <div class="row2"><button id="ovNo">취소</button><button class="bad" id="ovYes">확인</button></div>
</div></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
/* 참가자는 '보내기만' 합니다: 채널 구독/웹소켓 없이 HTTP 1회 전송 (수신 egress 0) */
(async () => {
const C = window.GT_CONFIG, $ = id => document.getElementById(id), S = sessionStorage;
const DEMO = new URLSearchParams(location.search).has('demo');
const show = v => { ['vMsg', 'vConsent', 'vMain'].forEach(x => { $(x).classList.add('hide'); $(x).style.display = ''; }); const e = $(v); e.classList.remove('hide'); if (v === 'vMain') e.style.display = 'flex'; };
const msg = (icon, t, d, btn) => { show('vMsg'); $('msgIcon').textContent = icon; $('msgT').textContent = t; $('msgD').textContent = d; const b = $('msgBtn'); if (btn) { b.textContent = btn.t; b.onclick = btn.f; b.classList.remove('hide'); } else b.classList.add('hide'); };
function confirmBox(t, d) { return new Promise(r => { $('ovT').textContent = t; $('ovD').textContent = d; $('ov').classList.add('show'); $('ovNo').onclick = () => { $('ov').classList.remove('show'); r(false); }; $('ovYes').onclick = () => { $('ov').classList.remove('show'); r(true); }; }); }

/* ---- 링크 파싱 (해시는 서버로 전송되지 않음) ---- */
let J = null;
try { J = JSON.parse(S.getItem('gt_join') || 'null'); } catch (e) {}
if (location.hash.length > 10) {
  const h = new URLSearchParams(location.hash.slice(1));
  J = { r: h.get('r'), o: h.get('o'), e: parseInt(h.get('e') || '0', 36) };
  S.setItem('gt_join', JSON.stringify(J)); S.removeItem('gt_consent');
  history.replaceState(null, '', location.pathname + location.search);
}
if (!J || !J.r || !J.o) return msg('🔗', '접속 링크가 올바르지 않습니다', '운영자가 보여주는 QR 코드를 다시 스캔해 주세요.');
if (J.e && Date.now() > J.e) { S.clear(); return msg('⌛', '종료된 방입니다', '운영자에게 새 QR 코드를 요청해 주세요.'); }
if (!DEMO && (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY)) return msg('⚙️', '서비스 설정 전입니다', '운영자에게 문의해 주세요.');
if (!navigator.geolocation) return msg('📵', '위치 기능을 사용할 수 없습니다', '다른 브라우저(Chrome, Safari)에서 열어 주세요.');

$('name').value = S.getItem('gt_name') || '';
let me = null, aes = null, timer = null, wake = null, ended = false, fixing = false;

function leavePage() {
  S.clear(); ended = true; clearInterval(timer);
  msg('👋', '접속이 종료되었습니다', '위치 정보는 더 이상 전송되지 않습니다. 이 창을 닫아도 됩니다.');
  try { window.close(); } catch (e) {}
  setTimeout(() => { if (!document.hidden) { try { location.replace('about:blank'); } catch (e) {} } }, 1500);
}

/* ---- 동의 ---- */
if (S.getItem('gt_consent') === '1') start(); else show('vConsent');
$('bDecline').onclick = async () => {
  if (await confirmBox('접속을 종료할까요?', '위치 공유에 동의하지 않으면 이 페이지에서 나가며, 위치 정보는 전혀 수집·전송되지 않습니다.')) leavePage();
};
$('bAgree').onclick = () => { S.setItem('gt_consent', '1'); S.setItem('gt_name', $('name').value.trim().slice(0, 12)); start(); };

/* ---- 시작 ---- */
async function start() {
  show('vMain');
  try {
    let jwk = null; try { jwk = JSON.parse(S.getItem('gt_priv') || 'null'); } catch (e) {}
    if (jwk && jwk.pub) me = { priv: await GT.importPriv(jwk.k), pub: jwk.pub };
    else { me = await GT.newKeyPair(); S.setItem('gt_priv', JSON.stringify({ k: await GT.exportPriv(me.priv), pub: me.pub })); }
    aes = await GT.deriveAes(me.priv, J.o);
  } catch (e) { return msg('⚠️', '보안 설정에 실패했습니다', '링크가 손상되었을 수 있습니다. QR을 다시 스캔해 주세요.'); }
  await fix();
  timer = setInterval(fix, C.SEND_INTERVAL_MS);
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || ended) return;
    try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    fix();
  });
}

/* ---- GPS ---- */
let demoLa = C.ANCHOR.lat + 0.0004, demoLo = C.ANCHOR.lng - 0.0006;
function getPos() {
  if (DEMO) { demoLa += (Math.random() - .5) * .00006; demoLo += (Math.random() - .5) * .00006; return Promise.resolve({ coords: { latitude: demoLa, longitude: demoLo, accuracy: 6 + Math.random() * 6 } }); }
  return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }));
}
async function fix() {
  if (ended || fixing) return; fixing = true;
  try {
    const c = (await getPos()).coords;
    $('lat').textContent = GT.dmsLat(c.latitude).text; $('lng').textContent = GT.dmsLng(c.longitude).text;
    $('dec').textContent = `${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}`;
    $('acc').textContent = `정확도 ±${Math.round(c.accuracy)}m`;
    const ok = await send('p', { la: +c.latitude.toFixed(6), lo: +c.longitude.toFixed(6), ac: Math.round(c.accuracy) });
    $('sent').textContent = (ok ? '전송 ' : '전송 실패 ') + GT.fmtTime(Date.now());
  } catch (e) {
    if (e && e.code === 1) { clearInterval(timer); return msg('🚫', '위치 권한이 거부되었습니다', '브라우저(또는 휴대폰) 설정에서 이 사이트의 위치 권한을 허용한 뒤 다시 시도해 주세요.', { t: '다시 시도', f: () => location.reload() }); }
    $('acc').textContent = '위치를 찾는 중… (실외에서 더 정확합니다)'; setTimeout(fix, 5000);
  } finally { fixing = false; }
  if (J.e && Date.now() > J.e) { ended = true; clearInterval(timer); S.clear(); msg('🏁', '유지 시간이 끝났습니다', '위치 공유가 중지되었습니다.'); }
}

/* ---- 전송 전용: Supabase Realtime REST broadcast (구독 없음) ---- */
async function send(t, extra) {
  if (DEMO) return true;
  try {
    const nm = S.getItem('gt_name') || ('참가자-' + me.pub.slice(-3));
    const d = await GT.seal(aes, { t, n: nm, ts: Date.now(), ...extra });
    const r = await fetch(C.SUPABASE_URL + '/realtime/v1/api/broadcast', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY },
      body: JSON.stringify({ messages: [{ topic: 'loc:' + J.r, event: 'm', payload: { pk: me.pub, d }, private: true }] })
    });
    return r.ok;
  } catch (e) { return false; }
}

$('bLeave').onclick = async () => {
  if (!await confirmBox('위치 공유를 종료할까요?', '종료하면 내 위치가 더 이상 운영자에게 전송되지 않습니다.')) return;
  clearInterval(timer); ended = true;
  await send('b');
  try { if (wake) wake.release(); } catch (e) {}
  leavePage();
};
})();
</script>
</body>
</html>
